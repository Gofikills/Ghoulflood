
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Вики и Ангелины 💗</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #25203d, #60466d, #a47791);
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

.card {
    width: 88%;
    max-width: 390px;
    padding: 40px 25px;
    text-align: center;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 40px #0004;
    animation: appear 1s ease;
}

@keyframes appear {
    from {opacity: 0; transform: translateY(25px);}
    to {opacity: 1; transform: translateY(0);}
}

.heart {
    font-size: 45px;
    margin-bottom: 20px;
    animation: beat 2s infinite;
}

@keyframes beat {
    50% {transform: scale(1.15);}
}

h1 {
    font-size: 27px;
    margin-bottom: 25px;
}

p {
    font-size: 16px;
    line-height: 1.8;
    color: #f5eaf5;
}

.small {
    margin-top: 25px;
    font-size: 13px;
    opacity: .7;
}

</style>
</head>
<body>

<div class="card">
    <div class="heart">💗</div>

    <h1>Вика & Ангелина</h1>

    <p>
        Пока мы знакомы совсем недолго,<br>
        но я решил сделать вам<br>
        небольшую открытку.
    </p>

    <p style="margin-top: 15px;">
        Просто потому что почему бы и нет? :)
    </p>

    <div class="small">Сделано с ✨</div>
</div>

</body>
</html>
